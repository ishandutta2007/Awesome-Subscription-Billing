<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="45%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f153a" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pulse Filter for dynamic glowing orbs -->
    <filter id="pulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <!-- Dynamic CSS Animations -->
    <style>
      .glow-orb-1 {
        animation: pulse1 7s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: pulse2 9s ease-in-out infinite alternate;
      }
      .glow-orb-3 {
        animation: pulse3 6s ease-in-out infinite alternate;
      }
      .floating-card {
        animation: float 5s ease-in-out infinite alternate;
      }
      .shimmer-line {
        stroke-dasharray: 200;
        stroke-dashoffset: 400;
        animation: dash 4s linear infinite;
      }
      .wave-bar {
        animation: scaleWave 2s ease-in-out infinite alternate;
        transform-origin: bottom;
      }

      @keyframes pulse1 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
        100% { transform: translate(60px, 30px) scale(1.25); opacity: 0.65; }
      }
      @keyframes pulse2 {
        0% { transform: translate(0px, 0px) scale(1.1); opacity: 0.3; }
        100% { transform: translate(-40px, -25px) scale(0.9); opacity: 0.6; }
      }
      @keyframes pulse3 {
        0% { transform: translate(0px, 0px) scale(0.9); opacity: 0.25; }
        100% { transform: translate(30px, -40px) scale(1.3); opacity: 0.55; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: 0; }
      }
      @keyframes scaleWave {
        0% { transform: scaleY(0.6); }
        100% { transform: scaleY(1.1); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Glowing Orbs -->
  <circle class="glow-orb-1" cx="200" cy="100" r="130" fill="#6366f1" filter="url(#pulseGlow)" />
  <circle class="glow-orb-2" cx="1000" cy="240" r="140" fill="#a855f7" filter="url(#pulseGlow)" />
  <circle class="glow-orb-3" cx="620" cy="300" r="110" fill="#ec4899" filter="url(#pulseGlow)" />

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Left Accent Tech Line -->
  <path d="M 60 40 L 60 320" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" />
  <circle cx="60" cy="40" r="6" fill="#6366f1" filter="url(#glow)" />
  <circle cx="60" cy="320" r="6" fill="#ec4899" filter="url(#glow)" />

  <!-- Shimmering Border Animation Around Center -->
  <path class="shimmer-line" d="M 90 320 L 1140 320" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- Main Title & Subtitle -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Super Header Badge -->
    <g transform="translate(95, 52)">
      <rect width="260" height="28" rx="14" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
      <circle cx="15" cy="14" r="5" fill="#10b981" />
      <text x="30" y="19" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="1.2">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="95" y="135" fill="#ffffff" font-size="46" font-weight="800" letter-spacing="-1">
      Awesome <tspan fill="url(#accentGrad)">Subscription Billing</tspan> 💳
    </text>

    <!-- Description / Subtitle -->
    <text x="95" y="178" fill="#94a3b8" font-size="19" font-weight="400">
      The definitive guide to recurring billing, usage metering &amp; revenue engines
    </text>

    <!-- Feature Tags -->
    <g transform="translate(95, 215)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="34" rx="8" fill="url(#cardGrad)" stroke="#6366f1" stroke-opacity="0.4" />
      <text x="14" y="22" fill="#c7d2fe" font-size="13" font-weight="600">⚡ Usage-Based</text>
      
      <!-- Tag 2 -->
      <rect x="142" y="0" width="150" height="34" rx="8" fill="url(#cardGrad)" stroke="#a855f7" stroke-opacity="0.4" />
      <text x="156" y="22" fill="#e9d5ff" font-size="13" font-weight="600">🔄 Recurring Billing</text>
      
      <!-- Tag 3 -->
      <rect x="304" y="0" width="145" height="34" rx="8" fill="url(#cardGrad)" stroke="#ec4899" stroke-opacity="0.4" />
      <text x="318" y="22" fill="#fbcfe8" font-size="13" font-weight="600">🌐 Open Source</text>
      
      <!-- Tag 4 -->
      <rect x="461" y="0" width="125" height="34" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.4" />
      <text x="475" y="22" fill="#a7f3d0" font-size="13" font-weight="600">🛡️ MoR &amp; Tax</text>
    </g>

    <!-- Secondary Meta Text -->
    <text x="95" y="295" fill="#64748b" font-size="14" font-weight="500">
      🚀 Top SaaS Giants &amp; Self-Hosted Open-Source Fintech Infrastructure
    </text>
  </g>

  <!-- Right Floating Metric Card UI -->
  <g class="floating-card" transform="translate(850, 60)">
    <!-- Card Frame -->
    <rect width="290" height="220" rx="14" fill="#0f172a" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.15" />
    
    <!-- Card Header -->
    <circle cx="25" cy="25" r="5" fill="#ef4444" />
    <circle cx="42" cy="25" r="5" fill="#f59e0b" />
    <circle cx="59" cy="25" r="5" fill="#10b981" />
    <text x="90" y="29" fill="#94a3b8" font-size="12" font-family="monospace">revenue_stream.json</text>

    <!-- Mini Dashboard Bars -->
    <g transform="translate(25, 60)">
      <text x="0" y="0" fill="#64748b" font-size="11" font-family="sans-serif" font-weight="600">MONTHLY RECURRING REVENUE</text>
      <text x="0" y="28" fill="#ffffff" font-size="24" font-family="sans-serif" font-weight="700">$248,500 <tspan fill="#10b981" font-size="14">+18.4%</tspan></text>
      
      <!-- Mini Chart Bars with dynamic pulse -->
      <g transform="translate(0, 48)">
        <rect class="wave-bar" x="0" y="10" width="18" height="40" rx="3" fill="#6366f1" fill-opacity="0.8" style="animation-delay: 0.1s" />
        <rect class="wave-bar" x="25" y="5" width="18" height="45" rx="3" fill="#6366f1" fill-opacity="0.8" style="animation-delay: 0.3s" />
        <rect class="wave-bar" x="50" y="18" width="18" height="32" rx="3" fill="#818cf8" fill-opacity="0.8" style="animation-delay: 0.2s" />
        <rect class="wave-bar" x="75" y="8" width="18" height="42" rx="3" fill="#a855f7" fill-opacity="0.8" style="animation-delay: 0.5s" />
        <rect class="wave-bar" x="100" y="0" width="18" height="50" rx="3" fill="#c084fc" fill-opacity="0.8" style="animation-delay: 0.4s" />
        <rect class="wave-bar" x="125" y="12" width="18" height="38" rx="3" fill="#ec4899" fill-opacity="0.8" style="animation-delay: 0.7s" />
        <rect class="wave-bar" x="150" y="4" width="18" height="46" rx="3" fill="#f472b6" fill-opacity="0.8" style="animation-delay: 0.6s" />
        <rect class="wave-bar" x="175" y="0" width="18" height="50" rx="3" fill="#10b981" style="animation-delay: 0.8s" />
      </g>
    </g>

    <!-- Subscription Status Badge -->
    <g transform="translate(25, 175)">
      <rect width="240" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <circle cx="16" cy="14" r="4" fill="#6366f1" />
      <text x="28" y="18" fill="#cbd5e1" font-size="11" font-family="monospace">Status: Active • Auto-Renew</text>
    </g>
  </g>
</svg>
